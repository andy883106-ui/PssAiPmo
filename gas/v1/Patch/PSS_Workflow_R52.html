window.editDailyReportV183=window.openReportWorkspaceR52;
window.saveReportWorkspaceFrontR52=async function(){if(!r52ReportData)return;working(true,'儲存回報修改...');try{const result=await api('saveReportWorkspaceR52',{token:token,reportId:r52ReportData.report.reportId,date:q('r52ReportDate').value,workType:q('r52ReportType').value,startTime:q('r52ReportStart').value,endTime:q('r52ReportEnd').value,crossDay:q('r52ReportCross').checked,location:q('r52ReportLocation').value,siteCode:q('r52ReportSite').value,projectName:q('r52ReportProject').value,eventTitle:q('r52ReportTitle').value,reportContent:q('r52ReportContent').value,files:await filesOf(q('r52ReportFiles')),completeTask:q('r52ReportComplete').checked});alert(result.message);closeR52();await refreshR52()}catch(error){showErr(error)}finally{working(false)}};

function reportHtmlR52(r){return '<div class="document"><b>'+x(r.date)+'｜'+x(r.person)+'｜'+x(r.project)+'</b>'+(r.batchId?'<span class="report-batch-badge-v183">'+x(r.batchId)+' #'+x(r.detailNo)+'</span>':'')+'<div><strong>'+x((r.startTime&&r.endTime?r.startTime+'～'+r.endTime+' ':'')+(r.eventTitle||''))+'</strong></div><div>'+x(r.reportContent)+'</div><div class="meta"><span>'+x(r.eventType||r.workType)+'</span><span>'+x(r.location||'')+'</span></div>'+attachmentLinks(r.attachments,r.attachment)+'<div class="r52-report-actions"><button onclick="openReportWorkspaceR52(\''+x(r.reportId)+'\')">編輯回報</button>'+(r.taskId?'<button onclick="openTaskWorkspaceR52(\''+x(r.taskId)+'\')">原任務</button>':'')+'</div></div>'}
window.reportHtml=reportHtmlR52;

// Fixes the removed batchStatus_* field that caused "Cannot set properties of null".
window.reportTask=async function(taskId){try{const task=await api('getTaskV17',token,taskId);const tab=document.querySelector('[data-page="reports"]');if(typeof showPage==='function')showPage('reports',tab);if(typeof resetBatchReportV183==='function')resetBatchReportV183();const ids=typeof getBatchItemIdsV183==='function'?getBatchItemIdsV183():[];const id=ids[0]||(typeof addBatchReportItemV183==='function'?addBatchReportItemV183():null);if(!id)throw new Error('無法建立回報項目。');const set=(name,value)=>{const el=q(name+'_'+id);if(el)el.value=value||''};set('batchTaskId',task.taskId);set('batchSite',task.siteCode);set('batchProject',task.projectName);set('batchProjectSearch',task.project);set('batchTitle',task.content);set('batchType',task.taskType||'任務回報');const complete=q('batchComplete_'+id);if(complete)complete.checked=false;const date=q('batchReportDateV183');if(date)date.value=dateNow();setTimeout(function(){q('batchContent_'+id)?.focus()},50)}catch(error){showErr(error)}};

function inboxTask(task){return '<div class="r52-work-row"><b>'+x(task.content||'(未填任務)')+'</b><small>'+x(task.project)+'｜期限 '+x(task.dueDate||'未定')+'｜'+x(task.displayStatus||task.status)+'</small>'+taskActions(task.taskId,task.status)+'</div>'}
function inboxColumn(title,items){return '<section class="r52-inbox-col"><h4>'+x(title)+' <span class="badge">'+items.length+'</span></h4>'+((items||[]).map(inboxTask).join('')||'<span class="muted">目前沒有項目</span>')+'</section>'}
function installInbox(){const page=q('page-dashboard');if(!page||q('r52Inbox'))return;const card=document.createElement('div');card.id='r52Inbox';card.className='card r52-inbox';card.innerHTML='<div class="muted">我的工作載入中…</div>';const anchor=page.querySelector('.grid2');page.insertBefore(card,anchor||page.firstChild)}
window.loadMyWorkInboxR52=async function(){installInbox();const host=q('r52Inbox');if(!host||!token)return;try{const data=await api('getMyWorkInboxR52',{token:token});const s=data.summary||{};host.innerHTML='<div class="r52-inbox-head"><div><h3>我的工作收件匣</h3><div class="muted">每日確認新派工、逾期、7日內到期與正式後續任務</div></div><button onclick="loadMyWorkInboxR52()">重新整理</button></div><div class="r52-stat-grid"><div class="r52-stat"><b>'+s.open+'</b>未完成</div><div class="r52-stat"><b>'+s.receivedToday+'</b>今日新派工</div><div class="r52-stat bad"><b>'+s.overdue+'</b>逾期</div><div class="r52-stat warn"><b>'+s.dueSoon+'</b>7日內到期</div><div class="r52-stat"><b>'+s.followUps+'</b>後續任務</div></div><div class="r52-inbox-cols">'+inboxColumn('今日收到',data.receivedToday||[])+inboxColumn('逾期未完成',data.overdue||[])+inboxColumn('7日內到期',data.dueSoon||[])+inboxColumn('之前工作後續',data.followUps||[])+'</div>'}catch(error){host.innerHTML='<div class="note">我的工作載入失敗：'+x(error&&error.message?error.message:error)+'</div>'}}

async function refreshR52(){r52ProjectIndex=[];r52ProjectPromise=null;try{if(typeof clearFrontCachesV1922==='function')clearFrontCachesV1922()}catch(ignore){}const jobs=[];if(typeof loadTaskBaseR50==='function')jobs.push(Promise.resolve(loadTaskBaseR50(true)));else if(typeof loadTaskCards==='function')jobs.push(Promise.resolve(loadTaskCards('taskList','taskKeyword')));if(typeof loadReports==='function')jobs.push(Promise.resolve(loadReports()));if(typeof loadDashboard==='function')jobs.push(Promise.resolve(loadDashboard()));jobs.push(Promise.resolve(loadMyWorkInboxR52()));await Promise.allSettled(jobs)}
window.refreshR52=refreshR52;

function injectDrawerActions(){const body=q('r4DrawerBody');if(!body||body.querySelector('.r52-drawer-actions'))return;const taskId=r52DrawerTaskId,projectCode=r52DrawerProjectCode;if(!taskId&&!projectCode)return;const bar=document.createElement('div');bar.className='r52-drawer-actions';bar.innerHTML=taskId?'<button onclick="openTaskWorkspaceR52(\''+x(taskId)+'\')">編輯／回報任務</button><button class="green" onclick="quickCompleteTaskR52(\''+x(taskId)+'\')">標示完成</button>':'<button onclick="r52OpenProjectDispatch(\''+x(projectCode)+'\')">新增專案派工</button>';body.prepend(bar)}
function wrapDrawers(){if(typeof window.openTaskDrawerR4==='function'&&!window.openTaskDrawerR4.__r52){const old=window.openTaskDrawerR4;window.openTaskDrawerR4=function(id){r52DrawerTaskId=id;r52DrawerProjectCode='';const result=old.apply(this,arguments);setTimeout(injectDrawerActions,350);return result};window.openTaskDrawerR4.__r52=true}if(typeof window.openProjectDrawerR4==='function'&&!window.openProjectDrawerR4.__r52){const old=window.openProjectDrawerR4;window.openProjectDrawerR4=function(code){r52DrawerProjectCode=code;r52DrawerTaskId='';const result=old.apply(this,arguments);setTimeout(injectDrawerActions,350);return result};window.openProjectDrawerR4.__r52=true}}
window.r52OpenProjectDispatch=function(code){const p=r52ProjectIndex.find(function(item){return item.siteCode===code});const tab=document.querySelector('[data-page="dispatch"]');if(typeof showPage==='function')showPage('dispatch',tab);if(p){const set=(id,v)=>{if(q(id))q(id).value=v||''};set('dispatchProjectSearch',p.label);set('dispatchSiteCode',p.siteCode);set('dispatchProjectName',p.projectName)}q('dispatchContent')?.focus()};

function bindGlobalAll(){const input=q('r50GlobalSearch'),panel=q('r50SearchPanel');if(!input||!panel||input.dataset.r52)return;input.dataset.r52='1';input.title='輸入 1 個字即搜尋；空白時連點兩下顯示專案清單';input.addEventListener('dblclick',async function(){if(input.value.trim())return;try{await projectIndex(false);const list=projectMatches('',30);panel.innerHTML='<div class="r50-search-section"><h4>全部專案（前 30 筆）</h4>'+list.map(function(p){return '<div class="r50-search-item" onclick="r50OpenProject(\''+x(p.siteCode)+'\')"><b>'+x(p.label)+'</b><small>'+x(p.customer)+'｜'+x(p.responsible||'')+'</small></div>'}).join('')+'</div>';panel.classList.add('open')}catch(error){showErr(error)}})}

async function afterLogin(){addApis();bindProjectSearches();bindGlobalAll();wrapDrawers();installInbox();await Promise.allSettled([projectIndex(false),loadMyWorkInboxR52()])}
function boot(){addApis();installModal();bindProjectSearches();bindGlobalAll();wrapDrawers();installInbox();const oldEnter=window.enterApp;if(typeof oldEnter==='function'&&!oldEnter.__r52){window.enterApp=async function(){const result=await oldEnter.apply(this,arguments);await afterLogin();return result};window.enterApp.__r52=true}if(token&&q('appView')&&!q('appView').classList.contains('hidden'))afterLogin()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
setTimeout(boot,900);
})();
</script>
