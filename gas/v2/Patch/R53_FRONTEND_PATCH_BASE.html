<script id="pssR53Script">
(function(){
'use strict';
const R53_API=['getTaskEditorR53','updateTaskR53','deleteTaskR53','findTaskDuplicatesR53','getProjectReportSettingR53','saveProjectReportSettingR53','getWeeklyMeetingWorkspaceR53','saveWeeklyMeetingSelectionR53','saveMeetingWorkItemR53','deleteMeetingWorkItemR53','reportMeetingWorkItemR53','generateWeeklyMeetingMinutesR53','getTrainingCenterR53','getTrainingCourseR53','saveTrainingCourseR53'];
R53_API.forEach(fn=>PUBLIC_API_V192.add(fn));
let r53TaskEditorData=null,r53ProjectReportSite='',r53MeetingData=null,r53MeetingTab='current',r53TrainingSystem='';
const r53E=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function r53InstallDom(){
  const modal=$('taskModal');if(modal&&!$('r53ExistingFiles')){
    const box=modal.querySelector('.modal-box'),save=box.querySelector('button.primary');
    const wrap=document.createElement('div');wrap.innerHTML='<div id="r53ExistingFiles" class="r53-existing-files"><b>既有附件</b><div id="r53ExistingFilesBody" class="r53-file-note">尚無附件</div></div><label>追加附件（原附件會保留）</label><input id="r53TaskFiles" type="file" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.csv,.txt"><div class="r53-file-note">再次編輯時會顯示既有附件，只有新選擇的檔案才會上傳。</div>';
    box.insertBefore(wrap,save);
  }
  if(!$('r53ProjectReportModal'))document.body.insertAdjacentHTML('beforeend',`<div id="r53ProjectReportModal" class="r53-modal"><div class="r53-modal-box"><div class="r53-modal-head"><div><h3>專案報告／回報狀況</h3><small id="r53ProjectReportTitle"></small></div><button class="r53-close" onclick="r53Close('r53ProjectReportModal')">×</button></div><label><input id="r53ProjectReportVisible" type="checkbox" style="width:auto"> 顯示於專案報告／關聯詳情</label><label>回報狀況</label><select id="r53ProjectReportStatus"><option>未設定</option><option>進行中</option><option>待回報</option><option>待確認</option><option>卡關</option><option>已完成</option><option>暫停</option></select><label>專案回報摘要</label><textarea id="r53ProjectReportSummary"></textarea><label>下次追蹤日</label><input id="r53ProjectReportNext" type="date"><div class="r53-inline-actions"><button class="primary" onclick="r53SaveProjectReport()">儲存</button><button onclick="r53Close('r53ProjectReportModal')">取消</button></div></div></div>`);
  if(!$('r53DuplicateModal'))document.body.insertAdjacentHTML('beforeend',`<div id="r53DuplicateModal" class="r53-modal"><div class="r53-modal-box"><div class="r53-modal-head"><div><h3>重複工作事項檢查</h3><small>相同專案＋內容＋負責人視為疑似重複，保留正確一筆後可刪除其餘。</small></div><button class="r53-close" onclick="r53Close('r53DuplicateModal')">×</button></div><div id="r53DuplicateBody"></div></div></div>`);
  if(!$('r53TrainingCourseEditModal'))document.body.insertAdjacentHTML('beforeend',`<div id="r53TrainingCourseEditModal" class="r53-modal"><div class="r53-modal-box"><div class="r53-modal-head"><h3>主管：課程／手冊設定</h3><button class="r53-close" onclick="r53Close('r53TrainingCourseEditModal')">×</button></div><input id="r53CourseId" type="hidden"><div class="r53-manual-grid"><div><label>系統分類</label><input id="r53CourseSystem"></div><div><label>課程名稱</label><input id="r53CourseTitle"></div><div class="wide"><label>課程說明／手冊摘要</label><textarea id="r53CourseDescription"></textarea></div><div><label>適用對象</label><input id="r53CourseAudience"></div><div><label>及格分數</label><input id="r53CoursePass" type="number" min="0" max="100"></div><div><label>學習確認</label><select id="r53CourseConfirm"><option>是</option><option>否</option></select></div><div><label>測驗要求</label><select id="r53CourseExam"><option>自動</option><option>是</option><option>否</option></select></div><div><label>簽名要求</label><select id="r53CourseSign"><option>是</option><option>否</option></select></div><div><label>狀態</label><select id="r53CourseStatus"><option>啟用</option><option>停用</option></select></div><div><label>排序</label><input id="r53CourseOrder" type="number"></div><div class="wide"><label>主要教材連結</label><input id="r53CourseMainUrl"></div><div class="wide"><label>教材資料夾連結</label><input id="r53CourseFolderUrl"></div></div><div class="r53-inline-actions"><button class="primary" onclick="r53SaveCourseConfig()">儲存課程設定</button><button onclick="r53Close('r53TrainingCourseEditModal')">取消</button></div></div></div>`);
  if(!$('r53MeetingLayer'))document.body.insertAdjacentHTML('beforeend',`<div id="r53MeetingLayer" class="r53-meeting-layer"><header class="r53-meeting-top"><div><h2>PSS｜本週工作監看與週四會議</h2><small id="r53MeetingRange">載入中…</small></div><div class="r53-meeting-actions"><button onclick="r53LoadMeeting(true)">重新檢視</button><button onclick="r53OpenManualMeetingItem()">＋新增會議事項</button><button onclick="r53GenerateMinutes()">產出會議紀錄</button><button onclick="r53OpenLegacyMeeting()">電子簽名／歷史</button><button onclick="r53CloseMeeting()">關閉</button></div></header><main class="r53-meeting-main"><div id="r53MeetingSummary" class="r53-week-summary"></div><nav class="r53-meeting-tabs"><button data-r53mt="current" onclick="r53MeetingSwitch('current',this)">本週工作</button><button data-r53mt="people" onclick="r53MeetingSwitch('people',this)">人員回報摘要</button><button data-r53mt="next" onclick="r53MeetingSwitch('next',this)">下週安排</button><button data-r53mt="selected" onclick="r53MeetingSwitch('selected',this)">會議追蹤清單</button><button data-r53mt="watch" onclick="r53MeetingSwitch('watch',this)">未完成監看</button></nav><section id="r53MeetingContent"></section></main></div>`);
  if(!$('r53MeetingItemModal'))document.body.insertAdjacentHTML('beforeend',`<div id="r53MeetingItemModal" class="r53-modal"><div class="r53-modal-box"><div class="r53-modal-head"><h3>新增／編輯會議工作事項</h3><button class="r53-close" onclick="r53Close('r53MeetingItemModal')">×</button></div><input id="r53MIId" type="hidden"><div class="r53-manual-grid"><div><label>分類</label><select id="r53MICategory"><option>本週工作事項</option><option>本週人員回報摘要</option><option>下一週安排</option><option>會議交代事項</option></select></div><div><label>關聯專案</label><select id="r53MIProject" onchange="r53MeetingProjectChanged()"></select></div><div class="wide"><label>事項</label><textarea id="r53MIItem"></textarea></div><div><label>負責人</label><input id="r53MIOwner"></div><div><label>協作人</label><input id="r53MICollab"></div><div><label>優先級</label><select id="r53MIPriority"><option>一般</option><option>高</option><option>緊急</option><option>低</option></select></div><div><label>預計完成日</label><input id="r53MIDue" type="date"></div><div><label>狀態</label><select id="r53MIStatus"><option>未開始</option><option>進行中</option><option>待確認</option><option>卡關</option><option>已完成</option></select></div><div class="wide"><label>目前回報狀況</label><textarea id="r53MIReport"></textarea></div><div class="wide"><label>會議決議</label><textarea id="r53MIDecision"></textarea></div></div><div class="r53-inline-actions"><button class="primary" onclick="r53SaveManualMeetingItem()">儲存</button><button onclick="r53Close('r53MeetingItemModal')">取消</button></div></div></div>`);
  const taskToolbar=document.querySelector('#page-tasks .toolbar');if(taskToolbar&&!$('r53DupBtn')){const b=document.createElement('button');b.id='r53DupBtn';b.textContent='檢查重複工作';b.onclick=r53ShowDuplicates;taskToolbar.appendChild(b)}
}
window.r53Close=id=>$(id)&&$(id).classList.remove('open');
function r53AttachmentHtml(items,folder){let h=(items||[]).map((f,i)=>`<div class="r53-existing-file"><a href="${r53E(f.url)}" target="_blank">${r53E(f.icon||'📎')} 既有附件 ${i+1}</a><button onclick="openUrl('${r53E(f.url)}')">開啟</button></div>`).join('');if(folder)h+=`<div class="r53-existing-file"><a href="${r53E(folder)}" target="_blank">📁 附件資料夾</a></div>`;return h||'<div class="r53-file-note">尚無既有附件。</div>'}
window.editTask=async function(taskId){try{r53InstallDom();const d=await api('getTaskEditorR53',{token,taskId});r53TaskEditorData=d;const t=d.task;$('editTaskId').value=t.taskId;$('editTaskContent').value=t.content;$('editTaskOwner').value=t.owner;$('editTaskType').value=t.taskType;$('editTaskPriority').value=t.priority||'一般';$('editTaskDue').value=t.dueDate;$('editTaskStatus').value=t.status||'未開始';$('editTaskNote').value=t.note;$('r53ExistingFilesBody').innerHTML=r53AttachmentHtml(d.existingAttachments,d.folderUrl);$('r53TaskFiles').value='';$('taskModal').classList.add('open')}catch(e){showError(e)}};
window.saveTaskEdit=async function(){busy(true,'更新工作事項與附件…');try{const files=await readFiles($('r53TaskFiles')?.files||[]);const res=await api('updateTaskR53',{token,taskId:$('editTaskId').value,content:$('editTaskContent').value,owner:$('editTaskOwner').value,taskType:$('editTaskType').value,priority:$('editTaskPriority').value,dueDate:$('editTaskDue').value,status:$('editTaskStatus').value,note:$('editTaskNote').value,files});alert(res.message);closeModal('taskModal');loadTaskCards('taskList','taskKeyword');loadTaskCards('dispatchTaskList','dispatchKeyword');if(r53MeetingData)r53LoadMeeting(true)}catch(e){showError(e)}finally{busy(false)}};
window.deleteTask=async function(taskId){if(!taskId)return;if(!confirm('確定刪除此工作事項？\n系統會先把原始內容保存到刪除紀錄，再從工作清單移除。'))return;try{const r=await api('deleteTaskR53',{token,taskId,reason:'使用者於工作事項頁刪除'});alert(r.message);loadTaskCards('taskList','taskKeyword');loadTaskCards('dispatchTaskList','dispatchKeyword');if(r53MeetingData)r53LoadMeeting(true)}catch(e){showError(e)}};
const oldRenderTaskCards=window.renderTaskCards||renderTaskCards;
window.renderTaskCards=function(targetId,list){$(targetId).innerHTML=(list||[]).map(t=>{const files=(t.attachments||[]).map(f=>`<a target="_blank" href="${r53E(f.url)}">${r53E(f.icon||'📎')}</a>`).join(' ');return`<div class="task-card ${t.status==='已完成'?'done':''} ${t.overdue?'overdue':''}"><div><div class="task-title">${r53E(t.content||'(未填任務內容)')}</div><div class="meta"><span>${r53E(t.project)}</span><span>負責：${r53E(t.owner)}</span><span>派工：${r53E(t.manager)}</span><span>類型：${r53E(t.taskType)}</span><span>優先：${r53E(t.priority)}</span><span>期限：${r53E(t.dueDate)}</span><span class="badge ${t.status==='已完成'?'done':t.overdue?'overdue':t.status==='進行中'?'doing':''}">${r53E(t.displayStatus)}</span></div>${t.note?`<div class="note"><b>備註：</b>${r53E(t.note)}</div>`:''}${files?`<div class="r53-inline-actions"><span>既有附件：</span>${files}</div>`:''}</div><div class="actions"><button onclick="reportTask('${r53E(t.taskId)}')">回報</button>${t.status!=='已完成'?`<button onclick="setTaskStatus('${r53E(t.taskId)}','進行中')">進行中</button><button class="green" onclick="setTaskStatus('${r53E(t.taskId)}','已完成')">完成</button>`:''}<button onclick="editTask('${r53E(t.taskId)}')">編輯</button><button class="red" onclick="deleteTask('${r53E(t.taskId)}')">刪除</button></div></div>`}).join('')||'<span class="muted">查無任務</span>'};
window.r53ShowDuplicates=async function(){try{const d=await api('findTaskDuplicatesR53',{token,onlyOpen:true});$('r53DuplicateBody').innerHTML=d.groups.length?d.groups.map((g,i)=>`<div class="r53-dup-group"><b>重複群組 ${i+1}｜${g.length} 筆</b>${g.map(t=>`<div class="r53-dup-row"><b>${r53E(t.siteCode)}｜${r53E(t.projectName)}</b><div>${r53E(t.content)}</div><small>${r53E(t.owner)}｜${r53E(t.status)}｜${r53E(t.taskId)}</small><div class="r53-inline-actions"><button onclick="editTask('${r53E(t.taskId)}')">檢視/編輯</button><button class="r53-danger" onclick="deleteTask('${r53E(t.taskId)}');r53Close('r53DuplicateModal')">刪除此筆</button></div></div>`).join('')}</div>`).join(''):'<div class="r53-meeting-empty">目前沒有偵測到未完成的重複工作事項。</div>';$('r53DuplicateModal').classList.add('open')}catch(e){showError(e)}};

/* 抽屜：每一筆工作可回報／編輯／刪除；專案可編輯回報狀況 */
window.taskListItemR4=function(t){return '<div class="r4-list-item"><header><b>'+r4e(t.content||t.eventTitle||'未填標題')+'</b><span class="badge '+(t.overdue?'overdue':t.status==='已完成'?'done':'doing')+'">'+r4e(t.displayStatus||t.status||'')+'</span></header><div class="muted">'+r4e(t.owner||t.person||'')+'｜'+r4e(t.dueDate||t.date||'')+'｜'+r4e(t.taskType||t.workType||'')+'</div>'+(t.note||t.reportContent?'<div class="r4-pre">'+r4e(t.note||t.reportContent)+'</div>':'')+(t.taskId?'<div class="r4-link-row"><button onclick="openTaskDrawerR4(\''+r4e(t.taskId)+'\')">詳情</button><button onclick="r53DrawerReport(\''+r4e(t.taskId)+'\')">回報</button><button onclick="editTask(\''+r4e(t.taskId)+'\')">編輯</button><button class="red" onclick="deleteTask(\''+r4e(t.taskId)+'\')">刪除</button></div>':'')+'</div>'};
window.r53DrawerReport=function(taskId){if(typeof closeKnowledgeDrawerR4==='function')closeKnowledgeDrawerR4();reportTask(taskId)};
const r53OldRenderDrawer=window.renderDrawerR4||renderDrawerR4;
window.renderDrawerR4=function(data){r53OldRenderDrawer(data);const pane=document.querySelector('#r4DrawerBody [data-pane="overview"]');if(!pane)return;if(data.kind==='task'){pane.insertAdjacentHTML('afterbegin',`<div class="r53-project-report-card"><div class="r53-report-head"><b>快速操作</b></div><div class="r53-inline-actions"><button onclick="r53DrawerReport('${r53E(data.task.taskId)}')">回報</button><button onclick="editTask('${r53E(data.task.taskId)}')">編輯工作</button><button class="r53-danger" onclick="deleteTask('${r53E(data.task.taskId)}')">刪除工作</button></div></div>`)}else{pane.insertAdjacentHTML('afterbegin',`<div id="r53DrawerProjectReport" class="r53-project-report-card"><div class="r53-report-head"><b>專案報告／回報狀況</b><span class="r53-report-badge">讀取中…</span></div><p>載入中…</p><div class="r53-inline-actions"><button onclick="r53EditProjectReport('${r53E(data.project.siteCode)}','${r53E(data.project.projectName)}')">編輯回報狀況</button><button onclick="r53ProjectQuickReport('${r53E(data.project.siteCode)}','${r53E(data.project.projectName)}')">新增工作回報</button></div></div>`);r53LoadProjectReportCard(data.project.siteCode)}};
window.r53LoadProjectReportCard=async function(siteCode){try{const s=await api('getProjectReportSettingR53',{token,siteCode}),box=$('r53DrawerProjectReport');if(!box)return;box.innerHTML=`<div class="r53-report-head"><b>專案報告／回報狀況</b><span class="r53-report-badge">${r53E(s.reportStatus||'未設定')}</span></div><p>${r53E(s.summary||'尚未填寫專案回報摘要。')}</p><small>報告顯示：${s.visible?'是':'否'}${s.nextFollowDate?'｜下次追蹤 '+r53E(s.nextFollowDate):''}${s.reportedAt?'｜最後更新 '+r53E(s.reportedAt):''}</small><div class="r53-inline-actions"><button onclick="r53EditProjectReport('${r53E(siteCode)}','')">編輯回報狀況</button><button onclick="r53ProjectQuickReport('${r53E(siteCode)}','')">新增工作回報</button></div>`}catch(e){console.warn(e)}};
window.r53EditProjectReport=async function(siteCode,projectName){try{r53ProjectReportSite=siteCode;const s=await api('getProjectReportSettingR53',{token,siteCode});$('r53ProjectReportTitle').textContent=[siteCode,projectName].filter(Boolean).join('｜');$('r53ProjectReportVisible').checked=s.visible!==false;$('r53ProjectReportStatus').value=s.reportStatus||'未設定';$('r53ProjectReportSummary').value=s.summary||'';$('r53ProjectReportNext').value=s.nextFollowDate||'';$('r53ProjectReportModal').classList.add('open')}catch(e){showError(e)}};
window.r53SaveProjectReport=async function(){try{const r=await api('saveProjectReportSettingR53',{token,siteCode:r53ProjectReportSite,visible:$('r53ProjectReportVisible').checked,reportStatus:$('r53ProjectReportStatus').value,summary:$('r53ProjectReportSummary').value,nextFollowDate:$('r53ProjectReportNext').value});alert(r.message);r53Close('r53ProjectReportModal');r53LoadProjectReportCard(r53ProjectReportSite)}catch(e){showError(e)}};
window.r53ProjectQuickReport=function(siteCode,projectName){if(typeof closeKnowledgeDrawerR4==='function')closeKnowledgeDrawerR4();showPage('reports',document.querySelector('[data-page=reports]'));$('reportTaskId').value='';$('reportSiteCode').value=siteCode;$('reportProjectName').value=projectName;$('reportProjectSearch').value=[siteCode,projectName].filter(Boolean).join('｜');$('reportEventTitle').value='專案進度回報';$('reportContent').focus()};

/* 每週工作監看／週四會議：每天皆可重新計算本週、下週、未完成 */
window.openWeeklyMeetingR53=async function(){r53InstallDom();$('r53MeetingLayer').classList.add('open');await r53LoadMeeting(true)};
window.r53CloseMeeting=function(){$('r53MeetingLayer').classList.remove('open')};
window.r53OpenLegacyMeeting=function(){const old='https://script.google.com/macros/s/AKfycbzsns5x5sT-nSmKuz1J-4tw4SNky1o0WEeWgvB_FGwWMznVHdmjn1AVlmq26aILdphq/exec';window.open(old+'?login='+encodeURIComponent((currentUser&&currentUser.account)||''),'PSS_MEETING_LEGACY')};
const r53OldOpenModule=window.openPmoModuleV20;
window.openPmoModuleV20=function(target){if(String(target||'').toUpperCase()==='MEETING')return openWeeklyMeetingR53();return r53OldOpenModule? r53OldOpenModule(target):null};
window.r53LoadMeeting=async function(force){try{$('r53MeetingContent').innerHTML='<div class="r53-meeting-empty">正在重新檢視本週工作、回報與下週安排…</div>';r53MeetingData=await api('getWeeklyMeetingWorkspaceR53',{token,baseDate:new Date().toISOString().slice(0,10),force:!!force});const w=r53MeetingData.week,s=r53MeetingData.summary;$('r53MeetingRange').textContent=`本週 ${w.start}～${w.end}｜週四 ${w.meetingDate}｜下週 ${w.nextStart}～${w.nextEnd}｜更新 ${r53MeetingData.generatedAt}`;$('r53MeetingSummary').innerHTML=[['本週需看',s.current],['下週安排',s.next],['未完成監看',s.watch],['本週回報',s.reports],['會議選取',s.selected]].map(x=>`<div class="r53-week-stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');r53MeetingSwitch(r53MeetingTab,document.querySelector(`[data-r53mt="${r53MeetingTab}"]`))}catch(e){showError(e);$('r53MeetingContent').innerHTML='<div class="r53-meeting-empty">'+r53E(e.message||e)+'</div>'}};
window.r53MeetingSwitch=function(tab,btn){r53MeetingTab=tab;document.querySelectorAll('[data-r53mt]').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');r53RenderMeeting()};
function r53TaskWeekCard(t,allowAdd=true){return`<article class="r53-week-card ${t.overdue?'overdue':''}"><h3>${r53E(t.siteCode)}｜${r53E(t.projectName)}</h3><div>${r53E(t.content)}</div><div class="r53-week-meta"><span>負責 ${r53E(t.owner)}</span><span>${r53E(t.status)}</span><span>期限 ${r53E(t.dueDate||'未定')}</span><span>${t.overdue?'逾期':''}</span></div><div class="r53-inline-actions">${allowAdd?`<button onclick="r53AddTaskToMeeting('${r53E(t.taskId)}')">加入會議追蹤</button>`:''}<button onclick="editTask('${r53E(t.taskId)}')">編輯</button><button onclick="r53MeetingTaskReport('${r53E(t.taskId)}')">回報</button><button class="r53-danger" onclick="deleteTask('${r53E(t.taskId)}')">刪除</button></div></article>`}
window.r53MeetingTaskReport=function(id){r53CloseMeeting();reportTask(id)};
window.r53AddTaskToMeeting=async function(id){try{const r=await api('saveWeeklyMeetingSelectionR53',{token,baseDate:new Date().toISOString().slice(0,10),taskId:id,category:r53MeetingTab==='next'?'下一週安排':'本週工作事項'});alert(r.message);await r53LoadMeeting(true);r53MeetingSwitch('selected',document.querySelector('[data-r53mt="selected"]'))}catch(e){showError(e)}};
function r53SelectedCard(x){return`<article class="r53-selected-card"><h3>${r53E(x.siteCode)}｜${r53E(x.projectName)}｜${r53E(x.item)}</h3><div class="r53-selected-grid"><div><label>回報狀況</label><textarea id="r53Rep_${r53E(x.itemId)}">${r53E(x.report)}</textarea></div><div><label>狀態</label><select id="r53Status_${r53E(x.itemId)}"><option ${x.status==='未開始'?'selected':''}>未開始</option><option ${x.status==='進行中'?'selected':''}>進行中</option><option ${x.status==='待確認'?'selected':''}>待確認</option><option ${x.status==='卡關'?'selected':''}>卡關</option><option ${x.status==='已完成'?'selected':''}>已完成</option></select><label>期限</label><input id="r53Due_${r53E(x.itemId)}" type="date" value="${r53E(x.dueDate)}"></div><div><label>會議決議</label><textarea id="r53Dec_${r53E(x.itemId)}">${r53E(x.decision)}</textarea></div></div><div class="r53-week-meta"><span>負責 ${r53E(x.owner)}</span><span>${r53E(x.category)}</span>${x.sourceId?`<span>來源 ${r53E(x.sourceId)}</span>`:''}${x.followTaskId?`<span>後續 ${r53E(x.followTaskId)}</span>`:''}</div><div class="r53-inline-actions"><button onclick="r53SaveMeetingReport('${r53E(x.itemId)}',false,false)">儲存回報</button><button class="green" onclick="r53SaveMeetingReport('${r53E(x.itemId)}',true,false)">完成並回報</button><button class="amber" onclick="r53SaveMeetingReport('${r53E(x.itemId)}',true,true)">本週完成＋下週追蹤</button><button onclick="r53EditMeetingItem('${r53E(x.itemId)}')">編輯事項</button><button class="r53-danger" onclick="r53RemoveMeetingItem('${r53E(x.itemId)}')">移除</button></div></article>`}
function r53RenderMeeting(){if(!r53MeetingData)return;let html='';if(r53MeetingTab==='current')html=(r53MeetingData.currentWeek||[]).map(t=>r53TaskWeekCard(t,true)).join('')||'<div class="r53-meeting-empty">本週沒有需要追蹤的工作。</div>';if(r53MeetingTab==='next')html=(r53MeetingData.nextWeek||[]).map(t=>r53TaskWeekCard(t,true)).join('')||'<div class="r53-meeting-empty">下週尚未安排工作。</div>';if(r53MeetingTab==='watch')html=(r53MeetingData.watchlist||[]).map(t=>r53TaskWeekCard(t,true)).join('')||'<div class="r53-meeting-empty">目前沒有未完成事項。</div>';if(r53MeetingTab==='people')html='<div class="r53-week-grid">'+(r53MeetingData.people||[]).map(p=>`<section class="r53-person-card"><h3>${r53E(p.name)}</h3><div class="r53-week-meta"><span>本週工作 ${p.tasks.length}</span><span>本週回報 ${p.reports.length}</span></div>${p.tasks.slice(0,12).map(t=>`<div class="r53-dup-row"><b>${r53E(t.projectName)}</b><div>${r53E(t.content)}</div><div class="r53-inline-actions"><button onclick="r53AddTaskToMeeting('${r53E(t.taskId)}')">選入會議</button><button onclick="editTask('${r53E(t.taskId)}')">編輯</button></div></div>`).join('')||'<small>無本週工作</small>'}</section>`).join('')+'</div>';if(r53MeetingTab==='selected')html=(r53MeetingData.selectedItems||[]).map(r53SelectedCard).join('')||'<div class="r53-meeting-empty">尚未選取會議追蹤事項。可由本週工作、人員摘要或下週安排選入，也可手動新增。</div>';$('r53MeetingContent').innerHTML=html}
window.r53SaveMeetingReport=async function(id,complete,next){try{const rep=$('r53Rep_'+id).value.trim();if(!rep)return alert('請先填寫回報狀況。');const nextAction=next?prompt('下週繼續追蹤事項（可修改）',r53MeetingData.selectedItems.find(x=>x.itemId===id)?.item||'')||'':'';const nextDue=next?prompt('下週追蹤期限 YYYY-MM-DD',r53MeetingData.week.nextEnd)||r53MeetingData.week.nextEnd:'';const r=await api('reportMeetingWorkItemR53',{token,baseDate:new Date().toISOString().slice(0,10),itemId:id,report:rep,status:complete?'已完成':$('r53Status_'+id).value,decision:$('r53Dec_'+id).value,completeTask:complete,continueNextWeek:next,nextAction,nextDueDate:nextDue});alert(r.message);await r53LoadMeeting(true)}catch(e){showError(e)}};
window.r53OpenManualMeetingItem=function(){if(!r53MeetingData)return;$('r53MIId').value='';$('r53MICategory').value='會議交代事項';$('r53MIProject').innerHTML='<option value="">請選專案</option>'+r53MeetingData.projects.map((p,i)=>`<option value="${i}">${r53E(p.label)}</option>`).join('');$('r53MIItem').value='';$('r53MIOwner').value=(currentUser&&currentUser.name)||'';$('r53MICollab').value='';$('r53MIPriority').value='一般';$('r53MIDue').value='';$('r53MIStatus').value='未開始';$('r53MIReport').value='';$('r53MIDecision').value='';$('r53MeetingItemModal').classList.add('open')};
window.r53MeetingProjectChanged=function(){};
window.r53EditMeetingItem=function(id){const x=r53MeetingData.selectedItems.find(i=>i.itemId===id);if(!x)return;r53OpenManualMeetingItem();$('r53MIId').value=x.itemId;$('r53MICategory').value=x.category;$('r53MIItem').value=x.item;$('r53MIOwner').value=x.owner;$('r53MICollab').value=x.collaborators;$('r53MIPriority').value=x.priority||'一般';$('r53MIDue').value=x.dueDate;$('r53MIStatus').value=x.status;$('r53MIReport').value=x.report;$('r53MIDecision').value=x.decision;const idx=r53MeetingData.projects.findIndex(p=>p.siteCode===x.siteCode);$('r53MIProject').value=idx>=0?String(idx):''};
window.r53SaveManualMeetingItem=async function(){try{const idx=Number($('r53MIProject').value),p=Number.isFinite(idx)&&r53MeetingData.projects[idx]?r53MeetingData.projects[idx]:{};const r=await api('saveMeetingWorkItemR53',{token,baseDate:new Date().toISOString().slice(0,10),itemId:$('r53MIId').value,category:$('r53MICategory').value,siteCode:p.siteCode||'',projectName:p.projectName||'',item:$('r53MIItem').value,owner:$('r53MIOwner').value,collaborators:$('r53MICollab').value,priority:$('r53MIPriority').value,dueDate:$('r53MIDue').value,status:$('r53MIStatus').value,report:$('r53MIReport').value,decision:$('r53MIDecision').value});alert(r.message);r53Close('r53MeetingItemModal');await r53LoadMeeting(true);r53MeetingSwitch('selected',document.querySelector('[data-r53mt="selected"]'))}catch(e){showError(e)}};
window.r53RemoveMeetingItem=async function(id){if(!confirm('從本週會議追蹤清單移除？原工作事項不會被刪除。'))return;try{await api('deleteMeetingWorkItemR53',{token,baseDate:new Date().toISOString().slice(0,10),itemId:id});await r53LoadMeeting(true)}catch(e){showError(e)}};
window.r53GenerateMinutes=async function(){try{const r=await api('generateWeeklyMeetingMinutesR53',{token,baseDate:new Date().toISOString().slice(0,10)});alert(r.message);window.open(r.url,'_blank')}catch(e){showError(e)}};

/* 教育訓練：第一層只選系統，第二層才顯示課程，課程內容再由原五步驟展開 */
window.loadTrainingR48=async function(force){try{const keep=r53TrainingSystem;trainingR48=await api('getTrainingCenterR53',{token});$('tr51SupervisorBtn').classList.toggle('hidden',!trainingR48.isManager);$('tr51SupervisorTab').classList.toggle('hidden',!trainingR48.isManager);$('tr51SyncBtn').classList.toggle('hidden',!trainingR48.isManager);const systems=(trainingR48.systems||[]).map(x=>x.name);r53TrainingSystem=force?'':(systems.includes(keep)?keep:'');buildTrainingFiltersR51();if(r53TrainingSystem){$('tr51System').value=r53TrainingSystem;trainingSystemChangedR51(false)}renderTrainingCatalogR51();renderTrainingCenterR48()}catch(e){showError(e)}};window.loadTraining=window.loadTrainingR48;
window.renderTrainingCatalogR51=function(){const systems=trainingR48.systems||[];$('tr51CatalogTree').innerHTML=systems.map(s=>`<button class="tr51-system-btn ${r53TrainingSystem===s.name?'active':''}" onclick="r53SelectTrainingSystem('${encodeURIComponent(s.name)}')"><span>${tr48Esc(s.name)}</span><small>${s.count}</small></button>`).join('')||'<span class="muted">尚無系統分類</span>'};
window.r53SelectTrainingSystem=function(encoded){r53TrainingSystem=decodeURIComponent(encoded||'');$('tr51System').value=r53TrainingSystem;trainingSystemChangedR51(false);renderTrainingCatalogR51();renderTrainingCenterR48()};
window.clearTrainingCatalogR51=function(){r53TrainingSystem='';$('tr51System').value='';$('tr51Device').value='';renderTrainingCatalogR51();renderTrainingCenterR48()};
window.renderTrainingCenterR48=function(){const s=trainingR48.summary||{};$('tr48Summary').innerHTML=[['全部資源',s.courses||0],['設備教育訓練',s.equipment||0],['進行中',s.started||0],['已完成',s.completed||0]].map(x=>`<div class="tr51-stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');$('tr48Tags').innerHTML=(trainingR48.tags||[]).slice(0,14).map(t=>`<button class="tr51-tag" onclick="applyTrainingTagR51('${encodeURIComponent(t.name)}')">${tr48Esc(t.name)} <small>${t.count}</small></button>`).join('');if(!r53TrainingSystem){$('tr48CourseGrid').innerHTML='<div class="r53-training-hint"><h3>先選擇系統</h3><p>選擇停管、門禁、訪客、梯控、批價機等系統後，再顯示該系統的課程清單。</p><div class="r53-system-stage">'+(trainingR48.systems||[]).map(s=>`<button class="r53-system-tile" onclick="r53SelectTrainingSystem('${encodeURIComponent(s.name)}')"><b>${tr48Esc(s.name)}</b><span>${s.count} 門課程／教材</span></button>`).join('')+'</div></div>';return}const kw=$('tr48Keyword').value.trim().toLowerCase(),kind=$('tr51Kind').value,status=$('tr48Status').value;let rows=trainingR48.courses.filter(c=>c.systemCategory===r53TrainingSystem&&(!kw||c.searchText.includes(kw))&&(!kind||c.kind===kind)&&(!status||(c.learningStatus||'未開始')===status));if(trainingTabR48==='equipment')rows=rows.filter(x=>x.kind==='設備教育訓練');if(trainingTabR48==='course')rows=rows.filter(x=>x.kind!=='設備教育訓練');if(trainingTabR48==='mine')rows=rows.filter(x=>x.progress>0||x.complete);rows.sort((a,b)=>(b.hot-a.hot)||(b.progress-a.progress)||(a.order-b.order)||a.title.localeCompare(b.title,'zh-Hant'));$('tr48CourseGrid').innerHTML=`<div class="r53-training-back"><strong>${tr48Esc(r53TrainingSystem)}｜課程清單</strong><button onclick="clearTrainingCatalogR51()">← 回到系統選擇</button></div>`+(rows.map(tr48CourseCard).join('')||'<div class="tr51-empty">此系統查無符合條件的課程。</div>')};
window.openTrainingCourseR48=async function(id,step){try{trainingCourseR48=await api('getTrainingCourseR53',{token,courseId:id});trainingStepR51=step||1;$('tr48CourseTitle').textContent=trainingCourseR48.course.title;$('tr48CourseMeta').textContent=[trainingCourseR48.course.systemCategory,trainingCourseR48.course.deviceCategory,trainingCourseR48.course.kind,trainingCourseR48.course.version].filter(Boolean).join('｜');renderTrainingCourseR48();$('tr48CourseModal').classList.add('open')}catch(e){showError(e)}};
const r53BaseRenderTrainingCourse=window.renderTrainingCourseR48||renderTrainingCourseR48;
window.renderTrainingCourseR48=function(){r53BaseRenderTrainingCourse();if(trainingStepR51===1&&trainingCourseR48&&trainingCourseR48.isManager){const body=$('tr48CourseBody');body.insertAdjacentHTML('afterbegin',`<div class="r53-course-admin"><b>主管課程管理</b><div class="r53-inline-actions"><button onclick="r53EditCourseConfig()">編輯課程／手冊資料</button><button onclick="tr51GoStep(2)">管理教材附件</button><button onclick="tr51GoStep(4)">管理測驗題庫</button></div></div>`)}};
window.r53EditCourseConfig=function(){const c=trainingCourseR48.course, cfg=trainingCourseR48.courseConfig||{};$('r53CourseId').value=c.id;$('r53CourseSystem').value=cfg.systemCategory||c.systemCategory||'';$('r53CourseTitle').value=cfg.title||c.title||'';$('r53CourseDescription').value=cfg.description||c.description||'';$('r53CourseAudience').value=cfg.audience||c.audience||'';$('r53CoursePass').value=cfg.passScore||c.passScore||70;$('r53CourseConfirm').value=cfg.requireConfirm||'是';$('r53CourseExam').value=cfg.requireExam||'自動';$('r53CourseSign').value=cfg.requireSignature||'是';$('r53CourseStatus').value=cfg.status||'啟用';$('r53CourseOrder').value=cfg.order||0;$('r53CourseMainUrl').value=cfg.mainUrl||c.url||'';$('r53CourseFolderUrl').value=cfg.folderUrl||c.folderUrl||'';$('r53TrainingCourseEditModal').classList.add('open')};
window.r53SaveCourseConfig=async function(){try{const r=await api('saveTrainingCourseR53',{token,courseId:$('r53CourseId').value,systemCategory:$('r53CourseSystem').value,title:$('r53CourseTitle').value,description:$('r53CourseDescription').value,audience:$('r53CourseAudience').value,passScore:$('r53CoursePass').value,requireConfirm:$('r53CourseConfirm').value,requireExam:$('r53CourseExam').value,requireSignature:$('r53CourseSign').value,status:$('r53CourseStatus').value,order:$('r53CourseOrder').value,mainUrl:$('r53CourseMainUrl').value,folderUrl:$('r53CourseFolderUrl').value});alert(r.message);r53Close('r53TrainingCourseEditModal');trainingCourseR48=await api('getTrainingCourseR53',{token,courseId:$('r53CourseId').value});$('tr48CourseTitle').textContent=trainingCourseR48.course.title;renderTrainingCourseR48();await loadTrainingR48(false);r53TrainingSystem=trainingCourseR48.course.systemCategory;renderTrainingCatalogR51();renderTrainingCenterR48()}catch(e){showError(e)}};

document.addEventListener('DOMContentLoaded',function(){setTimeout(r53InstallDom,0)});
})();
</script>
